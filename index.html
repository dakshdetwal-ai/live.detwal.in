<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DETWAL — Market Intelligence for Traders</title>
<meta name="description" content="Track market-moving economic events, market data and trading intelligence in one premium dashboard." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050505'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='bold' font-size='17' fill='%2300D9A5' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ============ THEME ============ */
:root{
  --bg:#050505; --bg2:#0A0A0A; --card:#101010; --card2:#151515;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --text:#FFFFFF; --sub:#A1A1AA; --muted:#71717A;
  --primary:#26A69A; --bright:#00D9A5;
  --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B; --blue:#3B82F6;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
::selection{background:rgba(0,217,165,.3);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:#0a0a0a;}
::-webkit-scrollbar-thumb{background:#262626;border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:#333;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ============ UTILITIES ============ */
.container{max-width:1200px;margin:0 auto;padding:0 24px;}
.flex{display:flex;align-items:center;}
.between{justify-content:space-between;}
.grid{display:grid;}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.pos{color:var(--pos);} .neg{color:var(--neg);} .warn{color:var(--warn);}
.muted{color:var(--muted);} .sub{color:var(--sub);}
.hidden{display:none !important;}

/* ============ COMPONENTS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;font-weight:600;font-size:14px;padding:11px 20px;border:1px solid transparent;transition:all .18s ease;min-height:44px;}
.btn-primary{background:var(--bright);color:#031612;}
.btn-primary:hover{background:#2ee8bb;transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,217,165,.25);}
.btn-secondary{background:var(--card2);color:#fff;border:1px solid var(--border2);}
.btn-secondary:hover{border-color:rgba(255,255,255,.3);background:#1b1b1b;}
.btn-ghost{background:transparent;color:var(--sub);}
.btn-ghost:hover{color:#fff;background:rgba(255,255,255,.05);}
.btn-danger{background:rgba(239,68,68,.12);color:var(--neg);border:1px solid rgba(239,68,68,.3);}
.btn-danger:hover{background:rgba(239,68,68,.22);}
.btn-sm{padding:7px 13px;font-size:13px;min-height:34px;border-radius:9px;}
.btn-block{width:100%;}
.icon-btn{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;background:transparent;border:1px solid transparent;color:var(--sub);transition:all .18s;}
.icon-btn:hover{background:rgba(255,255,255,.06);color:#fff;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;transition:border-color .2s,transform .2s,box-shadow .2s;}
.card-hover:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:0 10px 40px rgba(0,0,0,.5);}
.glass{background:rgba(255,255,255,.03);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.pill-high{background:rgba(239,68,68,.14);color:#f87171;border:1px solid rgba(239,68,68,.3);}
.pill-critical{background:rgba(239,68,68,.18);color:#f87171;border:1px solid rgba(239,68,68,.45);box-shadow:0 0 14px rgba(239,68,68,.25);}
.pill-med{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.3);}
.pill-low{background:rgba(255,255,255,.06);color:var(--sub);border:1px solid var(--border);}
.pill-green{background:rgba(0,217,165,.1);color:var(--bright);border:1px solid rgba(0,217,165,.3);}
.pill-blue{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.3);}
.pill-gray{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border);}

.input,select.input,textarea.input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:11px;color:#fff;padding:12px 14px;font-size:14px;outline:none;transition:border-color .18s;min-height:44px;}
.input:focus{border-color:var(--primary);}
.input::placeholder{color:var(--muted);}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:7px;}
.field{margin-bottom:16px;}

.toggle{position:relative;width:44px;height:24px;background:#2a2a2a;border-radius:999px;cursor:pointer;transition:background .2s;flex-shrink:0;border:none;}
.toggle.on{background:var(--bright);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle.on::after{transform:translateX(20px);}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
th{text-align:left;padding:12px 16px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);background:var(--bg2);white-space:nowrap;}
td{padding:13px 16px;border-bottom:1px solid var(--border);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr{transition:background .15s;}
tbody tr:hover{background:rgba(255,255,255,.025);}

/* ============ ANIMATIONS ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
@keyframes slideRight{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
@keyframes barFill{from{width:0;}}
@keyframes drawLine{from{stroke-dashoffset:600;}to{stroke-dashoffset:0;}}
.a-up{animation:fadeUp .4s ease-out both;}
.a-in{animation:fadeIn .4s ease-out both;}
.a-scale{animation:scaleIn .45s cubic-bezier(.2,.8,.3,1) both;}
.d1{animation-delay:.06s;} .d2{animation-delay:.12s;} .d3{animation-delay:.18s;} .d4{animation-delay:.24s;} .d5{animation-delay:.3s;} .d6{animation-delay:.36s;}
.pulse{animation:pulse 1.6s ease-in-out infinite;}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}
.prob-bar{height:8px;border-radius:999px;animation:barFill .9s ease-out both;}
.spark path{stroke-dasharray:600;animation:drawLine 1.1s ease-out both;}

/* ============ NAVBAR ============ */
#navbar{position:fixed;top:0;left:0;right:0;z-index:100;transition:all .25s;padding:14px 0;}
#navbar.scrolled{background:rgba(5,5,5,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:10px 0;}
.logo{font-weight:800;font-size:19px;letter-spacing:.09em;display:inline-flex;align-items:center;gap:7px;}
.logo .dot{width:8px;height:8px;background:var(--bright);border-radius:50%;box-shadow:0 0 10px var(--bright);}
.nav-links{display:flex;gap:4px;}
.nav-links a{padding:9px 14px;border-radius:9px;color:var(--sub);font-size:14px;font-weight:500;transition:all .15s;}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.05);}
.hamburger{display:none;}
#mobileMenu{position:fixed;inset:0;z-index:200;background:rgba(5,5,5,.97);backdrop-filter:blur(10px);padding:24px;display:none;flex-direction:column;}
#mobileMenu.open{display:flex;animation:fadeIn .2s both;}
#mobileMenu a{padding:16px;font-size:18px;font-weight:600;border-bottom:1px solid var(--border);}

/* ============ HERO ============ */
.hero{position:relative;padding:150px 0 80px;overflow:hidden;}
.hero-glow{position:absolute;top:-180px;left:50%;transform:translateX(-50%);width:900px;height:600px;background:radial-gradient(ellipse at center,rgba(0,217,165,.1),transparent 65%);pointer-events:none;}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);pointer-events:none;}
.hero h1{font-size:clamp(36px,6vw,64px);font-weight:800;line-height:1.1;letter-spacing:-.02em;}
.hero .grad{background:linear-gradient(90deg,var(--bright),#6ee7c8);-webkit-background-clip:text;background-clip:text;color:transparent;}
.terminal{background:rgba(13,13,13,.92);border:1px solid var(--border2);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 60px rgba(0,217,165,.06);overflow:hidden;}
.term-head{display:flex;align-items:center;gap:7px;padding:12px 18px;border-bottom:1px solid var(--border);background:#0b0b0b;}
.term-dot{width:10px;height:10px;border-radius:50%;}

/* ============ DASHBOARD LAYOUT ============ */
.shell{display:flex;min-height:100vh;}
.sidebar{width:248px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:90;transition:transform .25s ease;}
.sidebar .s-links{flex:1;padding:10px 12px;overflow-y:auto;}
.s-link{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;color:var(--sub);font-size:14px;font-weight:500;margin-bottom:2px;transition:all .15s;cursor:pointer;border:1px solid transparent;}
.s-link:hover{color:#fff;background:rgba(255,255,255,.04);}
.s-link.active{color:var(--bright);background:rgba(0,217,165,.08);border-color:rgba(0,217,165,.18);}
.main{flex:1;margin-left:248px;min-width:0;}
.topbar{position:sticky;top:0;z-index:80;background:rgba(5,5,5,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:13px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
.page-pad{padding:26px;max-width:1300px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:85;display:none;}
@media(max-width:980px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .overlay.show{display:block;animation:fadeIn .2s both;}
}

/* ============ MODAL / TOAST / DROPDOWN ============ */
#modalRoot{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:18px;}
#modalRoot.open{display:flex;}
#modalRoot .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);animation:fadeIn .2s both;}
#modalRoot .modal{position:relative;background:var(--card2);border:1px solid var(--border2);border-radius:18px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;animation:scaleIn .25s cubic-bezier(.2,.8,.3,1) both;}
#toastRoot{position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:10px;max-width:92vw;}
.toast{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--border2);border-radius:13px;padding:13px 17px;font-size:14px;font-weight:500;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:slideRight .25s ease-out both;min-width:260px;}
.dropdown{position:absolute;top:52px;right:0;width:min(360px,calc(100vw - 32px));background:var(--card2);border:1px solid var(--border2);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:150;animation:scaleIn .18s ease-out both;transform-origin:top right;overflow:hidden;}

/* ============ SEARCH PALETTE ============ */
#searchRoot{position:fixed;inset:0;z-index:350;display:none;justify-content:center;padding:14vh 18px 18px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);}
#searchRoot.open{display:flex;animation:fadeIn .15s both;}
#searchBox{width:100%;max-width:560px;height:fit-content;background:var(--card2);border:1px solid var(--border2);border-radius:16px;overflow:hidden;animation:scaleIn .2s both;}
.sr-item{display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--border);}
.sr-item:hover{background:rgba(255,255,255,.05);}

/* ============ MISC ============ */
.demo-badge{position:fixed;bottom:18px;left:18px;z-index:250;background:rgba(0,217,165,.1);border:1px solid rgba(0,217,165,.35);color:var(--bright);font-size:11px;font-weight:700;letter-spacing:.1em;padding:6px 12px;border-radius:999px;backdrop-filter:blur(8px);}
.section{padding:84px 0;}
.sec-title{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.01em;}
.feature-ico{width:46px;height:46px;border-radius:13px;background:rgba(0,217,165,.09);border:1px solid rgba(0,217,165,.2);display:flex;align-items:center;justify-content:center;color:var(--bright);margin-bottom:16px;}
.faq-q{width:100%;background:none;border:none;color:#fff;font-size:16px;font-weight:600;text-align:left;padding:19px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.faq-a{color:var(--sub);padding-bottom:19px;display:none;font-size:14.5px;}
.faq-item{border-bottom:1px solid var(--border);}
.faq-item.open .faq-a{display:block;animation:fadeUp .25s both;}
.stat-num{font-size:26px;font-weight:800;letter-spacing:-.01em;}
.price-num{font-size:42px;font-weight:800;}
.tab-btn{padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:13px;font-weight:600;transition:all .15s;}
.tab-btn.active{background:rgba(0,217,165,.1);border-color:rgba(0,217,165,.35);color:var(--bright);}
.tf-btn{padding:6px 12px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;transition:all .15s;}
.tf-btn.active{background:rgba(0,217,165,.12);color:var(--bright);}
.unread-dot{position:absolute;top:9px;right:9px;width:8px;height:8px;background:var(--neg);border-radius:50%;border:2px solid var(--bg);}
footer{border-top:1px solid var(--border);padding:56px 0 34px;background:var(--bg2);}
footer a{color:var(--muted);font-size:14px;display:block;margin-bottom:10px;transition:color .15s;}
footer a:hover{color:#fff;}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;}
.notif-item{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:12px;cursor:pointer;transition:background .15s;}
.notif-item:hover{background:rgba(255,255,255,.03);}
.notif-item.unread{background:rgba(0,217,165,.04);}
.empty{text-align:center;padding:52px 20px;color:var(--muted);}
@media(max-width:880px){
  .nav-links,.nav-cta{display:none;}
  .hamburger{display:inline-flex;}
  .page-pad{padding:18px 14px;}
  .topbar{padding:12px 14px;}
  .hero{padding:118px 0 56px;}
  .section{padding:56px 0;}
}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.dash-main{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr;}}
@media(max-width:760px){.g2,.g3,.g4,.dash-main{grid-template-columns:1fr;}}
</style>
</head>

<div id="app"></div>
<div id="modalRoot"><div class="backdrop" onclick="Modal.close()"></div><div class="modal" id="modalContent"></div></div>

  <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;">
    <span id="srIcon"></span><input id="searchInput" class="input" style="border:none;background:transparent;min-height:auto;padding:4px;" placeholder="Search news, markets, pages…" />
    <span class="pill pill-gray">ESC</span>
  </div>
  <div id="searchResults" style="max-height:340px;overflow-y:auto;"></div>
</div></div>
<div class="demo-badge">● DEMO MODE</div>

const fmtPrice = p => p>=1000 ? p.toLocaleString('en-US',{minimumFractionDigits:p<10000?2:0,maximumFractionDigits:p<10000?2:0}) : p.toFixed(4);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const impactPill = i => '<span class="pill '+(i==='HIGH'?'pill-high':i==='MEDIUM'?'pill-med':'pill-low')+'">'+i+'</span>';
function seededSeries(seed,n,base,vol){
 let s=seed,out=[],v=base;
 const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
 for(let i=0;i<n;i++){v+=(rnd()-0.48)*vol;out.push(+v.toFixed(2));}
 return out;
}
function sparkSVG(data,color,w=110,h=34){
 const mn=Math.min(...data),mx=Math.max(...data),r=mx-mn||1;
 const pts=data.map((v,i)=>((i/(data.length-1))*w).toFixed(1)+','+((h-3)-((v-mn)/r)*(h-6)).toFixed(1)).join(' ');
 return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="M'+pts.split(' ').join(' L')+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round"/></svg>';
}
function countdownStr(ts){
 let d=Math.max(0,Math.floor((ts-Date.now())/1000));
 if(d<=0) return 'RELEASED';
 const dd=Math.floor(d/86400),h=Math.floor(d%86400/3600),m=Math.floor(d%3600/60),s=d%60,p=n=>String(n).padStart(2,'0');
 return (dd>0?p(dd)+':':'')+p(h)+':'+p(m)+':'+p(s);
}
function eventDateLabel(ts){
 const d=new Date(ts);
 return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();

function animateCounters(){
 document.querySelectorAll('[data-count]').forEach(el=>{
   const target=+el.dataset.count; let cur=0; const step=Math.max(1,Math.ceil(target/24));
   const iv=setInterval(()=>{cur+=step;if(cur>=target){cur=target;clearInterval(iv);}el.textContent=cur;},35);
 });
}
function tfData(tf){
 const cfg={'1H':[1,60,3849,0.9],'4H':[2,60,3846,2.2],'1D':[7,48,3838,4.5],'1W':[11,56,3800,11]}[tf];
 const data=seededSeries(cfg[0],cfg[1],cfg[2],cfg[3]);
 const labels=data.map((_,i)=>{
   const d=new Date(Date.now()-(data.length-i)*({'1H':60,'4H':240,'1D':1800,'1W':10800}[tf])*1000);
   return tf==='1W'?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
 });
 return {data,labels};
}
function initMainChart(tf){
 const el=document.getElementById('mainChart'); if(!el||typeof Chart==='undefined') return;
 const {data,labels}=tfData(tf);
 const ctx=el.getContext('2d');
 const grad=ctx.createLinearGradient(0,0,0,280);
 grad.addColorStop(0,'rgba(0,217,165,.22)');grad.addColorStop(1,'rgba(0,217,165,0)');
 charts.push(new Chart(ctx,{type:'line',data:{labels,datasets:[{data,borderColor:'#00D9A5',borderWidth:2,fill:true,backgroundColor:grad,pointRadius:0,pointHoverRadius:4,pointHoverBackgroundColor:'#00D9A5',tension:.35}]},
  options:{responsive:true,maintainAspectRatio:false,animation:{duration:900,easing:'easeOutQuart'},
   plugins:{legend:{display:false},tooltip:{backgroundColor:'#151515',borderColor:'rgba(255,255,255,.14)',borderWidth:1,titleColor:'#A1A1AA',bodyColor:'#fff',padding:12,displayColors:false,callbacks:{label:c=>'$'+c.parsed.y.toLocaleString()}}},
   scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#71717A',font:{size:10},maxTicksLimit:8}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#71717A',font:{size:10},callback:v=>'$'+v.toFixed(0)}}}
  }}));
}
function switchTF(btn,tf){
 btn.parentElement.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 charts.forEach(c=>{try{c.destroy();}catch(e){}}); charts=[];
 initMainChart(tf);
}

 if(f.q) items=items.filter(n=>n.title.toLowerCase().includes(f.q.toLowerCase()));

 +'<td><div class="flex" style="gap:4px"><button class="icon-btn" style="width:32px;height:32px" title="Edit" aria-label="Edit" onclick="newsForm(\''+n.id+'\')">'+I('edit',14)+'</button>'
 +'<button class="icon-btn" style="width:32px;height:32px;color:var(--neg)" title="Delete" aria-label="Delete" onclick="confirmModal(\'Delete event?\',\''+esc(n.title)+' will be removed from the demo calendar.\',()=>adminDeleteNews(\''+n.id+'\'))">'+I('trash',14)+'</button></div></td></tr>').join('')
 +'</tbody></table></div></div>';
}
function newsForm(id){
 const n=id?news.find(x=>x.id===id):{title:'',impact:'HIGH',currency:'USD',country:'US',previous:'',forecast:'',actual:'',bull:50,bear:40,neutral:10,ts:Date.now()+86400000,markets:['XAUUSD'],desc:'',hist:''};
 window.__editNewsId=id||null;
 const dt=new Date(n.ts-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
 Modal.open('<div class="flex between" style="margin-bottom:18px"><b style="font-size:18px">'+(id?'Edit':'Create')+' event</b><button class="icon-btn" aria-label="Close" onclick="Modal.close()">'+I('x',18)+'</button></div>'
 +'<div class="field"><label class="lbl">Title</label><input class="input" id="nfTitle" value="'+esc(n.title)+'"></div>'
 +'<div class="g2" style="gap:12px"><div class="field"><label class="lbl">Impact</label><select class="input" id="nfImpact">'+['HIGH','MEDIUM','LOW'].map(x=>'<option'+(n.impact===x?' selected':'')+'>'+x+'</option>').join('')+'</select></div>'
 +'<div class="field"><label class="lbl">Currency</label><select class="input" id="nfCcy">'+['USD','EUR','GBP','JPY'].map(x=>'<option'+(n.currency===x?' selected':'')+'>'+x+'</option>').join('')+'</select></div></div>'
 +'<div class="g3" style="gap:12px"><div class="field"><label class="lbl">Previous</label><input class="input" id="nfPrev" value="'+esc(n.previous)+'"></div><div class="field"><label class="lbl">Forecast</label><input class="input" id="nfFcst" value="'+esc(n.forecast)+'"></div><div class="field"><label class="lbl">Actual</label><input class="input" id="nfAct" value="'+esc(n.actual||'')+'" placeholder="—"></div></div>'
 +'<div class="field"><label class="lbl">Release time</label><input class="input" id="nfTime" type="datetime-local" value="'+dt+'"></div>'
 +'<div class="g3" style="gap:12px"><div class="field"><label class="lbl">Bull %</label><input class="input" id="nfBull" type="number" value="'+n.bull+'"></div><div class="field"><label class="lbl">Bear %</label><input class="input" id="nfBear" type="number" value="'+n.bear+'"></div><div class="field"><label class="lbl">Neutral %</label><input class="input" id="nfNeu" type="number" value="'+n.neutral+'"></div></div>'
 +'<div class="field"><label class="lbl">Affected markets (comma separated)</label><input class="input" id="nfMkts" value="'+n.markets.join(', ')+'"></div>'
 +'<button class="btn btn-primary btn-block" onclick="saveNewsForm()">'+(id?'Save changes':'Create event')+'</button>');
}
function saveNewsForm(){
 const g=i=>document.getElementById(i).value;
 const title=g('nfTitle').trim(); if(!title) return Toast.show('Title required.','error');
 const obj={title,impact:g('nfImpact'),currency:g('nfCcy'),country:'US',previous:g('nfPrev')||'—',forecast:g('nfFcst')||'—',actual:g('nfAct')||null,
   ts:new Date(g('nfTime')).getTime()||Date.now()+86400000,bull:+g('nfBull')||0,bear:+g('nfBear')||0,neutral:+g('nfNeu')||0,
   markets:g('nfMkts').split(',').map(s=>s.trim()).filter(Boolean),
   desc:'Admin-created demo event.',hist:'No historical observations recorded yet. Demo context only.'};
 if(window.__editNewsId){ Object.assign(news.find(x=>x.id===window.__editNewsId),obj); Toast.show('Event updated.'); }
 else{ obj.id='ev'+Date.now(); news.push(obj); Toast.show('Event created.'); }
 saveNews(); Modal.close(); render();
}
function adminDeleteNews(id){ news=news.filter(n=>n.id!==id); saveNews(); Toast.show('Event deleted.','info'); render(); }

function adminCoupons(){

function couponForm(idx){
 const c=idx!=null?coupons[idx]:{code:'',type:'percent',value:10,expiry:'2026-12-31',limit:100,status:'active'};
 window.__editCoupon=idx!=null?idx:null;
 Modal.open('<div class="flex between" style="margin-bottom:18px"><b style="font-size:18px">'+(idx!=null?'Edit':'Create')+' coupon</b><button class="icon-btn" aria-label="Close" onclick="Modal.close()">'+I('x',18)+'</button></div>'
 +'<div class="field"><label class="lbl">Code</label><input class="input" id="cpCode" value="'+esc(c.code)+'" style="text-transform:uppercase"></div>'
 +'<div class="g2" style="gap:12px"><div class="field"><label class="lbl">Discount %</label><input class="input" id="cpVal" type="number" value="'+c.value+'"></div><div class="field"><label class="lbl">Usage limit</label><input class="input" id="cpLim" type="number" value="'+c.limit+'"></div></div>'

}
function saveCouponForm(){
 const code=document.getElementById('cpCode').value.trim().toUpperCase();
 if(!code) return Toast.show('Code required.','error');
 const obj={code,type:'percent',value:+document.getElementById('cpVal').value||0,limit:+document.getElementById('cpLim').value||0,expiry:document.getElementById('cpExp').value,status:document.getElementById('cpSt').value};
 if(window.__editCoupon!=null) coupons[window.__editCoupon]=obj; else coupons.push(obj);
 saveCoupons(); Modal.close(); Toast.show('Coupon saved.'); render();
}
function adminDeleteCoupon(i){ coupons.splice(i,1); saveCoupons(); Toast.show('Coupon deleted.','info'); render(); }
