<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Track market-moving economic events, market data and trading intelligence in one premium dashboard.">
  <meta property="og:title" content="DETWAL — Market Intelligence for Traders">
  <meta property="og:description" content="Market intelligence built around the economic events that move markets.">
  <title>DETWAL — Market Intelligence for Traders</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0a'/%3E%3Cpath d='M18 15h12c13 0 20 7 20 17S43 49 30 49H18V15zm10 8v18h3c7 0 11-3 11-9s-4-9-11-9h-3z' fill='%23fff'/%3E%3Ccircle cx='48' cy='16' r='5' fill='%2300d9a5'/%3E%3C/svg%3E">
  <style>
    :root{
      color-scheme:dark;
      --bg:#050505;
      --surface:#0a0a0a;
      --card:#101010;
      --card2:#151515;
      --border:rgba(255,255,255,.085);
      --border-strong:rgba(255,255,255,.14);
      --text:#fff;
      --muted:#a1a1aa;
      --subtle:#71717a;
      --green:#26a69a;
      --bright:#00d9a5;
      --positive:#22c55e;
      --negative:#ef4444;
      --warning:#f59e0b;
      --blue:#3b82f6;
      --radius:16px;
      --shadow:0 24px 80px rgba(0,0,0,.42);
      --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:88px}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;overflow-x:hidden}
    body.light{
      color-scheme:light;
      --bg:#f4f6f7;--surface:#fff;--card:#fff;--card2:#f3f5f6;
      --border:rgba(10,20,25,.1);--border-strong:rgba(10,20,25,.17);
      --text:#111719;--muted:#5b666a;--subtle:#7d898d;--shadow:0 20px 60px rgba(30,40,40,.13);
    }
    button,input,select,textarea{font:inherit}
    button{color:inherit}
    a{color:inherit;text-decoration:none}
    img,canvas,svg{display:block}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
      outline:2px solid var(--bright);outline-offset:3px
    }
    ::selection{background:rgba(0,217,165,.25);color:#fff}
    ::-webkit-scrollbar{width:9px;height:9px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:#303536;border-radius:99px}
    ::-webkit-scrollbar-thumb:hover{background:#4b5556}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .subtle{color:var(--subtle)}
    .positive{color:var(--positive)}
    .negative{color:var(--negative)}
    .warning-text{color:var(--warning)}
    .mono,.number{font-variant-numeric:tabular-nums}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:-.035em}
    .container{width:min(1200px,calc(100% - 48px));margin-inline:auto}
    .section{padding:92px 0}
    .section.compact{padding:64px 0}
    .section-head{max-width:700px;margin-bottom:34px}
    .section-head.center{text-align:center;margin-inline:auto}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--bright);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.15em}
    .eyebrow::before{content:"";width:18px;height:1px;background:currentColor}
    h1,h2,h3,h4,p{margin-top:0}
    h1{font-size:clamp(42px,7vw,76px);line-height:1.01;letter-spacing:-.065em;margin:18px 0 20px;font-weight:760}
    h2{font-size:clamp(28px,4vw,42px);line-height:1.12;letter-spacing:-.045em;margin:12px 0}
    h3{letter-spacing:-.025em}
    .lead{font-size:17px;line-height:1.75;color:var(--muted);max-width:590px}
    .section-head.center .lead{margin-inline:auto}
    .divider{border:0;border-top:1px solid var(--border);margin:0}
    .icon{width:18px;height:18px;flex:0 0 auto}
    .icon.sm{width:15px;height:15px}
    .icon.lg{width:22px;height:22px}
    .btn{
      border:1px solid transparent;border-radius:11px;min-height:44px;padding:0 17px;
      display:inline-flex;align-items:center;justify-content:center;gap:9px;
      font-weight:700;font-size:13px;letter-spacing:-.01em;cursor:pointer;
      transition:transform .18s ease,background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease;
      white-space:nowrap
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(0) scale(.99)}
    .btn-primary{background:var(--bright);color:#04120f;box-shadow:0 6px 24px rgba(0,217,165,.11)}
    .btn-primary:hover{background:#36ebba;box-shadow:0 8px 28px rgba(0,217,165,.2)}
    .btn-secondary{background:rgba(255,255,255,.035);border-color:var(--border);color:var(--text)}
    .btn-secondary:hover{background:rgba(255,255,255,.07);border-color:var(--border-strong)}
    .btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
    .btn-ghost:hover{color:var(--text);background:rgba(255,255,255,.045)}
    .btn-danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.25);color:#ff8a8a}
    .btn-danger:hover{background:rgba(239,68,68,.2)}
    .btn-sm{min-height:34px;padding:0 11px;font-size:12px;border-radius:9px}
    .btn-icon{width:40px;height:40px;padding:0;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid var(--border);display:inline-grid;place-items:center;cursor:pointer;transition:.18s}
    .btn-icon:hover{background:rgba(255,255,255,.09);border-color:var(--border-strong)}
    .btn-icon.small{width:33px;height:33px;border-radius:9px}
    .brand{display:inline-flex;align-items:center;gap:9px;font-weight:850;letter-spacing:.17em;font-size:17px}
    .brand-mark{height:25px;width:25px;border:1px solid rgba(0,217,165,.4);border-radius:8px;display:grid;place-items:center;color:var(--bright);font-size:12px;letter-spacing:-.08em;background:rgba(0,217,165,.07)}
    .brand-dot{width:5px;height:5px;background:var(--bright);border-radius:50%;display:inline-block;margin-left:-6px;margin-top:-12px;box-shadow:0 0 12px rgba(0,217,165,.6)}
    .badge,.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--border);border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
    .badge-demo{background:rgba(0,217,165,.07);border-color:rgba(0,217,165,.22);color:var(--bright)}
    .pill-muted{color:var(--muted);background:rgba(255,255,255,.035)}
    .pill-green{color:#5ee6bf;background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.2)}
    .pill-red{color:#ff8d8d;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.2)}
    .pill-yellow{color:#f9c76e;background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.2)}
    .pill-blue{color:#8dbbff;background:rgba(59,130,246,.11);border-color:rgba(59,130,246,.2)}
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--positive);box-shadow:0 0 10px rgba(34,197,94,.5)}
    .status-dot.off{background:var(--subtle);box-shadow:none}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 34px rgba(0,0,0,.13)}
    .card-hover{transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
    .card-hover:hover{transform:translateY(-2px);border-color:rgba(0,217,165,.22);box-shadow:0 18px 45px rgba(0,0,0,.23)}
    .card-pad{padding:22px}
    .surface{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
    .form-field{display:grid;gap:7px;margin-bottom:16px}
    .form-field label{font-size:12px;font-weight:650;color:var(--muted)}
    .input,.select,.textarea{
      width:100%;min-height:44px;padding:10px 12px;color:var(--text);
      background:var(--surface);border:1px solid var(--border);border-radius:10px;
      outline:none;transition:border .18s,box-shadow .18s
    }
    .input:focus,.select:focus,.textarea:focus{border-color:rgba(0,217,165,.58);box-shadow:0 0 0 3px rgba(0,217,165,.08)}
    .textarea{resize:vertical;min-height:110px}
    .select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#818b8c 50%),linear-gradient(135deg,#818b8c 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
    .check-row{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
    input[type="checkbox"]{accent-color:var(--green);width:16px;height:16px}
    .field-hint{font-size:11px;color:var(--subtle);margin-top:-3px}
    .alert{padding:12px 14px;border:1px solid var(--border);background:rgba(255,255,255,.03);border-radius:11px;color:var(--muted);font-size:12px}
    .alert.error{border-color:rgba(239,68,68,.28);background:rgba(239,68,68,.07);color:#ff9d9d}
    .alert.success{border-color:rgba(34,197,94,.24);background:rgba(34,197,94,.07);color:#8ce5ac}
    .empty-state{text-align:center;padding:44px 20px;color:var(--muted)}
    .empty-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;margin:0 auto 14px;background:rgba(255,255,255,.045);color:var(--subtle)}
    .empty-state h3{color:var(--text);margin-bottom:6px}
    .empty-state p{max-width:400px;margin:0 auto 16px;font-size:13px}
    .page-enter{animation:pageIn .34s cubic-bezier(.2,.7,.25,1) both}
    @keyframes pageIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(239,68,68,.22)}50%{opacity:.8;box-shadow:0 0 0 5px rgba(239,68,68,0)}}
    @keyframes shimmer{to{background-position:-200% 0}}
    @keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .reveal{opacity:0;transform:translateY(16px);transition:opacity .65s ease,transform .65s ease}
    .reveal.is-visible{opacity:1;transform:none}
    .loading-line{height:10px;border-radius:99px;background:linear-gradient(90deg,#111 25%,#1b1f1f 42%,#111 65%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}

    /* Public navigation and landing page */
    .public-nav{position:sticky;top:0;z-index:40;height:72px;border-bottom:1px solid rgba(255,255,255,.055);background:rgba(5,5,5,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .public-nav-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:26px}
    .public-links{display:flex;align-items:center;gap:29px;color:#a1a1aa;font-size:12px;font-weight:650}
    .public-links a,.public-links button{transition:color .18s;cursor:pointer}
    .public-links a:hover,.public-links button:hover{color:#fff}
    .nav-actions{display:flex;align-items:center;gap:9px}
    .nav-mobile-toggle{display:none}
    .mobile-menu{display:none}
    .hero{min-height:620px;position:relative;overflow:hidden;padding:82px 0 76px;background:
      radial-gradient(ellipse at 78% 38%,rgba(0,217,165,.13),transparent 36%),
      radial-gradient(ellipse at 18% 0,rgba(38,166,154,.08),transparent 35%),var(--bg)}
    .hero:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:58px 58px;mask-image:linear-gradient(to bottom,black,transparent 86%)}
    .hero-inner{position:relative;display:grid;grid-template-columns:.92fr 1.08fr;align-items:center;gap:55px}
    .hero-copy{animation:fadeUp .7s ease both}
    .hero-copy h1 span{color:var(--bright)}
    .hero-copy .lead{margin-bottom:28px}
    .hero-actions{display:flex;gap:11px;flex-wrap:wrap}
    .hero-trust{display:flex;align-items:center;gap:10px;margin-top:26px;color:var(--subtle);font-size:11px}
    .hero-trust .status-dot{width:6px;height:6px}
    .hero-preview-wrap{position:relative;animation:pop .75s .08s cubic-bezier(.2,.7,.2,1) both;min-width:0}
    .hero-preview-glow{position:absolute;inset:13% 6%;filter:blur(65px);background:rgba(0,217,165,.1);pointer-events:none}
    .preview-window{position:relative;background:linear-gradient(150deg,#111717,#0a0c0c 62%);border:1px solid rgba(255,255,255,.12);border-radius:19px;padding:17px;box-shadow:0 30px 100px rgba(0,0,0,.55);transform:perspective(1200px) rotateY(-3deg) rotateX(1deg)}
    .preview-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 14px;border-bottom:1px solid var(--border)}
    .preview-brand{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em}
    .preview-top-right{display:flex;gap:7px;align-items:center}
    .preview-dots{display:flex;gap:4px}
    .preview-dots i{width:5px;height:5px;border-radius:50%;background:#4c5657}
    .preview-content{padding-top:15px}
    .preview-summary{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
    .preview-price{font-size:27px;font-weight:750;letter-spacing:-.055em;margin:4px 0 1px}
    .preview-symbol{font-size:11px;color:var(--muted);font-weight:750}
    .preview-label{font-size:9px;color:var(--subtle);text-transform:uppercase;letter-spacing:.09em}
    .preview-chart{height:150px;margin:10px -2px 4px}
    .preview-bottom{display:grid;grid-template-columns:1.1fr .9fr;gap:9px}
    .preview-mini{border:1px solid var(--border);background:rgba(255,255,255,.025);border-radius:11px;padding:11px}
    .preview-mini-title{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;gap:7px}
    .preview-event{font-size:12px;font-weight:700;margin:7px 0 3px}
    .preview-countdown{font-size:15px;font-weight:750;letter-spacing:.04em}
    .preview-bars{display:grid;gap:7px;margin-top:9px}
    .prob-mini-row{display:grid;grid-template-columns:51px 1fr 28px;align-items:center;gap:5px;font-size:9px;color:var(--muted)}
    .bar-track{height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
    .bar-fill{height:100%;border-radius:99px;background:var(--bright);width:0;transition:width 1s cubic-bezier(.15,.75,.3,1)}
    .bar-fill.red{background:var(--negative)}
    .bar-fill.yellow{background:var(--warning)}
    .market-strip{border-block:1px solid var(--border);background:#090b0b}
    .strip-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:17px 0;overflow:hidden}
    .strip-label{font-size:10px;color:var(--subtle);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
    .strip-items{display:flex;align-items:center;gap:28px;overflow:auto;scrollbar-width:none}
    .strip-items::-webkit-scrollbar{display:none}
    .strip-item{display:flex;align-items:center;gap:9px;white-space:nowrap;font-size:11px}
    .strip-item strong{font-size:11px}
    .strip-item span{font-size:10px}
    .feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
    .feature-card{padding:22px;min-height:170px}
    .feature-icon{width:39px;height:39px;border-radius:12px;background:rgba(0,217,165,.08);border:1px solid rgba(0,217,165,.15);color:var(--bright);display:grid;place-items:center;margin-bottom:18px}
    .feature-card h3{font-size:15px;margin:0 0 7px}
    .feature-card p{font-size:12px;color:var(--muted);line-height:1.7;margin:0}
    .split-section{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
    .insight-list{display:grid;gap:15px;margin:24px 0}
    .insight-item{display:flex;gap:12px;align-items:flex-start}
    .insight-check{width:23px;height:23px;flex:0 0 auto;border-radius:8px;background:rgba(0,217,165,.1);color:var(--bright);display:grid;place-items:center}
    .insight-item strong{font-size:13px;display:block;margin-bottom:2px}
    .insight-item span{color:var(--muted);font-size:12px}
    .home-calendar{overflow:hidden}
    .calendar-row{display:grid;grid-template-columns:67px minmax(145px,1fr) 75px 94px;align-items:center;gap:12px;padding:14px 17px;border-top:1px solid var(--border)}
    .calendar-row:first-of-type{border-top:0}
    .calendar-time{font-size:11px;color:var(--muted)}
    .calendar-event-title{font-size:12px;font-weight:700}
    .calendar-meta{font-size:10px;color:var(--subtle);margin-top:2px}
    .market-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .market-card{padding:17px;min-width:0;cursor:pointer}
    .market-card-top{display:flex;align-items:center;justify-content:space-between}
    .market-name{font-size:12px;font-weight:800}
    .market-category{font-size:9px;color:var(--subtle);margin-top:2px}
    .market-price{font-size:21px;letter-spacing:-.05em;font-weight:750;margin:17px 0 2px}
    .market-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .spark{height:37px;width:82px}
    .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .step-card{padding:19px;position:relative}
    .step-no{font-size:10px;color:var(--bright);font-weight:800;letter-spacing:.12em}
    .step-card h3{font-size:14px;margin:13px 0 6px}
    .step-card p{font-size:11px;color:var(--muted);margin:0;line-height:1.65}
    .pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .pricing-card{padding:24px;position:relative;display:flex;flex-direction:column;min-height:340px}
    .pricing-card.featured{border-color:rgba(0,217,165,.36);box-shadow:0 0 40px rgba(0,217,165,.06)}
    .pricing-card.featured:before{content:"MOST POPULAR";position:absolute;top:-10px;right:18px;font-size:9px;font-weight:850;letter-spacing:.1em;color:#03130f;background:var(--bright);border-radius:99px;padding:5px 9px}
    .plan-name{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted)}
    .plan-price{font-size:39px;letter-spacing:-.07em;font-weight:780;margin:13px 0 0}
    .plan-price small{font-size:12px;letter-spacing:0;color:var(--muted);font-weight:500}
    .plan-note{font-size:10px;color:var(--subtle);min-height:20px}
    .plan-features{list-style:none;padding:0;margin:20px 0 23px;display:grid;gap:10px;color:var(--muted);font-size:11px}
    .plan-features li{display:flex;gap:8px;align-items:center}
    .plan-features .icon{color:var(--bright);width:14px;height:14px}
    .pricing-card .btn{margin-top:auto;width:100%}
    .billing-toggle{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--border);background:var(--surface);padding:4px;border-radius:11px}
    .billing-toggle button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;padding:8px 12px;border-radius:8px;cursor:pointer}
    .billing-toggle button.active{background:rgba(0,217,165,.12);color:var(--bright)}
    .save-note{font-size:9px;color:var(--positive);margin-left:5px}
    .faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .faq-item{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:0 16px}
    .faq-item summary{list-style:none;cursor:pointer;padding:16px 24px 16px 0;position:relative;font-size:12px;font-weight:700}
    .faq-item summary::-webkit-details-marker{display:none}
    .faq-item summary:after{content:"+";position:absolute;right:0;top:11px;color:var(--bright);font-size:19px;font-weight:400}
    .faq-item[open] summary:after{content:"−"}
    .faq-answer{font-size:11px;color:var(--muted);line-height:1.75;padding:0 0 15px}
    .cta-panel{position:relative;overflow:hidden;padding:47px;border:1px solid rgba(0,217,165,.2);border-radius:22px;background:radial-gradient(ellipse at 82% 22%,rgba(0,217,165,.11),transparent 44%),linear-gradient(130deg,#101414,#090a0a)}
    .cta-panel h2{max-width:630px;margin:10px 0 11px}
    .cta-panel p{color:var(--muted);font-size:13px;margin-bottom:22px}
    .footer{border-top:1px solid var(--border);background:#080909;padding:45px 0 24px}
    .footer-top{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:34px;padding-bottom:36px}
    .footer-brand p{max-width:230px;color:var(--muted);font-size:11px;line-height:1.7;margin:14px 0}
    .footer-col strong{display:block;font-size:11px;margin-bottom:13px}
    .footer-col a,.footer-col button{display:block;color:var(--muted);font-size:11px;margin:8px 0;cursor:pointer;text-align:left}
    .footer-col a:hover,.footer-col button:hover{color:#fff}
    .footer-bottom{padding-top:17px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:14px;color:var(--subtle);font-size:10px}
    .disclaimer-note{font-size:10px;color:var(--subtle);line-height:1.65;max-width:680px;margin-top:12px}
    .cookie-banner{position:fixed;left:18px;bottom:18px;z-index:45;max-width:380px;padding:14px;background:#121515;border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;animation:pop .25s ease}
    .cookie-banner p{font-size:10px;color:var(--muted);margin:0;line-height:1.5}
    .cookie-actions{display:flex;gap:6px;flex:0 0 auto}

    /* Dashboard application */
    .app-shell{display:flex;min-height:100vh;background:var(--bg)}
    .sidebar{width:250px;flex:0 0 250px;position:fixed;inset:0 auto 0 0;z-index:35;background:#090a0a;border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .22s ease,transform .25s ease;overflow:hidden}
    .sidebar.collapsed{width:78px;flex-basis:78px}
    .sidebar-head{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);white-space:nowrap}
    .sidebar.collapsed .sidebar-head{padding:0 15px;justify-content:center}
    .sidebar.collapsed .sidebar-head .brand-text,.sidebar.collapsed .sidebar-label,.sidebar.collapsed .side-link span,.sidebar.collapsed .sidebar-plan,.sidebar.collapsed .side-user-meta,.sidebar.collapsed .side-user-arrow{display:none}
    .sidebar.collapsed .side-link{justify-content:center;padding-inline:0}
    .sidebar.collapsed .side-user{justify-content:center;padding-inline:0}
    .side-scroll{overflow-y:auto;padding:17px 11px;flex:1}
    .sidebar-label{padding:9px 11px 7px;color:#626d6f;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    .side-nav{display:grid;gap:3px}
    .side-link{height:42px;display:flex;align-items:center;gap:12px;padding:0 11px;border-radius:10px;color:#929b9c;font-size:12px;font-weight:600;transition:.18s;white-space:nowrap;cursor:pointer}
    .side-link:hover{background:rgba(255,255,255,.045);color:#fff}
    .side-link.active{background:rgba(0,217,165,.085);color:#72e9c5}
    .side-link.active .icon{color:var(--bright)}
    .side-link .icon{width:17px;height:17px}
    .side-link .side-count{margin-left:auto;font-size:9px;color:var(--subtle);background:rgba(255,255,255,.06);padding:3px 6px;border-radius:99px}
    .sidebar-bottom{border-top:1px solid var(--border);padding:12px}
    .sidebar-plan{font-size:9px;color:var(--subtle);padding:5px 8px 11px}
    .side-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;cursor:pointer;min-width:0}
    .side-user:hover{background:rgba(255,255,255,.04)}
    .avatar{height:33px;width:33px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;color:#b3ffec;background:linear-gradient(145deg,#1b665b,#10332e);font-size:11px;font-weight:800;border:1px solid rgba(0,217,165,.25)}
    .avatar.admin{background:linear-gradient(145deg,#4b3c75,#241d38);color:#d4c8ff;border-color:rgba(167,139,250,.25)}
    .side-user-meta{min-width:0;flex:1}
    .side-user-meta strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .side-user-meta span{font-size:9px;color:var(--subtle)}
    .main-stage{min-width:0;flex:1;margin-left:250px;transition:margin-left .22s ease}
    .sidebar.collapsed~.main-stage{margin-left:78px}
    .topbar{height:72px;position:sticky;top:0;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 27px;background:rgba(5,5,5,.8);border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}
    body.light .topbar{background:rgba(244,246,247,.86)}
    .topbar-left,.topbar-right{display:flex;align-items:center;gap:11px;min-width:0}
    .topbar-title{font-size:12px;color:var(--muted);font-weight:650}
    .topbar-search{display:flex;align-items:center;gap:9px;min-width:210px;padding:8px 10px;color:var(--subtle);background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:11px}
    .topbar-search kbd{margin-left:auto;border:1px solid var(--border);border-radius:4px;padding:1px 4px;font-size:9px;color:var(--subtle)}
    .topbar-mobile-menu{display:none}
    .notification-wrap{position:relative}
    .notification-dot{position:absolute;right:7px;top:7px;width:6px;height:6px;background:var(--negative);border-radius:50%;box-shadow:0 0 0 2px var(--bg)}
    .notification-panel{position:absolute;right:0;top:49px;width:min(360px,calc(100vw - 24px));background:#111414;border:1px solid var(--border-strong);border-radius:15px;box-shadow:var(--shadow);z-index:50;animation:pop .18s ease;overflow:hidden}
    .notification-head{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid var(--border)}
    .notification-head strong{font-size:12px}
    .notification-list{max-height:330px;overflow:auto}
    .notification-item{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.045)}
    .notification-item:last-child{border-bottom:0}
    .notification-item.unread{background:rgba(0,217,165,.035)}
    .notification-item p{font-size:11px;line-height:1.5;margin:0 0 4px}
    .notification-item time{font-size:9px;color:var(--subtle)}
    .notification-icon{width:28px;height:28px;border-radius:9px;background:rgba(0,217,165,.09);color:var(--bright);display:grid;place-items:center;flex:0 0 auto}
    .page-body{max-width:1450px;margin:auto;padding:27px}
    .page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:21px}
    .page-heading h1{font-size:25px;letter-spacing:-.045em;margin:0 0 5px}
    .page-heading p{color:var(--muted);font-size:12px;margin:0}
    .heading-actions{display:flex;align-items:center;gap:8px}
    .market-status{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:9px;background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.15);font-size:10px;font-weight:750;color:#8ce5ac}
    .demo-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-5px 0 18px;padding:9px 12px;border:1px solid rgba(0,217,165,.14);border-radius:10px;background:rgba(0,217,165,.035);font-size:10px;color:var(--muted)}
    .demo-strip .badge{font-size:9px;padding:4px 7px}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
    .stat-card{padding:17px;min-width:0}
    .stat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:10px}
    .stat-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.045);color:var(--bright)}
    .stat-value{font-size:21px;font-weight:760;letter-spacing:-.045em;margin:11px 0 2px}
    .stat-foot{font-size:9px;color:var(--subtle)}
    .dash-grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(275px,.85fr);gap:13px;margin-bottom:13px}
    .dash-grid-secondary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px;margin-bottom:13px}
    .card-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .card-heading h2,.card-heading h3{font-size:13px;margin:0}
    .card-heading p{font-size:10px;color:var(--subtle);margin:4px 0 0}
    .chart-card{padding:19px;min-width:0}
    .chart-main-price{font-size:26px;font-weight:770;letter-spacing:-.06em;margin:15px 0 0}
    .chart-subline{display:flex;align-items:center;gap:9px;font-size:10px;color:var(--muted);margin-top:1px}
    .timeframes{display:flex;gap:3px;background:rgba(255,255,255,.035);border:1px solid var(--border);padding:3px;border-radius:8px}
    .timeframes button{border:0;background:transparent;padding:5px 7px;border-radius:6px;font-size:9px;color:var(--muted);cursor:pointer}
    .timeframes button.active{background:rgba(0,217,165,.12);color:var(--bright)}
    .main-chart{width:100%;height:225px;margin-top:12px}
    .news-side-card{padding:19px;min-width:0}
    .news-side-top{display:flex;justify-content:space-between;align-items:center;gap:9px}
    .news-side-card h3{font-size:17px;line-height:1.35;letter-spacing:-.03em;margin:19px 0 6px}
    .news-country{font-size:10px;color:var(--muted)}
    .countdown-large{font-size:27px;font-weight:760;letter-spacing:.04em;margin:20px 0 15px}
    .countdown-large.releasing{color:var(--warning);animation:pulse 1.5s infinite}
    .data-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .data-cell{padding:9px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);border-radius:9px}
    .data-cell span{display:block;font-size:9px;color:var(--subtle);margin-bottom:3px}
    .data-cell strong{font-size:11px}
    .prob-card{padding:19px}
    .prob-breakdown{display:grid;gap:13px;margin-top:19px}
    .prob-label{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;margin-bottom:6px}
    .prob-label strong{color:var(--text);font-size:11px}
    .prob-footnote{font-size:9px;color:var(--subtle);margin-top:15px;line-height:1.6}
    .mini-market-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}
    .mini-market{padding:11px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.02);min-width:0}
    .mini-market-head{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:750}
    .mini-market-price{font-size:14px;letter-spacing:-.03em;font-weight:730;margin:8px 0 2px}
    .mini-market-foot{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:9px}
    .activity-list{display:grid;gap:0}
    .activity-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
    .activity-item:last-child{border-bottom:0;padding-bottom:0}
    .activity-icon{height:28px;width:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted);background:rgba(255,255,255,.045)}
    .activity-text{min-width:0;flex:1}
    .activity-text strong{font-size:10px;display:block}
    .activity-text span{font-size:9px;color:var(--subtle)}
    .activity-item time{font-size:9px;color:var(--subtle);white-space:nowrap}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:13px}
    table{width:100%;border-collapse:collapse;min-width:730px}
    th{text-align:left;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);font-weight:750;padding:12px 14px;background:rgba(255,255,255,.025);white-space:nowrap}
    td{padding:12px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);white-space:nowrap}
    td strong{color:var(--text);font-weight:650}
    tr:hover td{background:rgba(255,255,255,.018)}
    .table-event{display:flex;align-items:center;gap:10px}
    .country-flag{width:27px;height:27px;border-radius:8px;background:rgba(255,255,255,.055);display:grid;place-items:center;font-size:9px;font-weight:800;color:#d5d5d5}
    .impact{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
    .impact:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .impact-low{color:#a1a1aa}
    .impact-medium{color:var(--warning)}
    .impact-high{color:#ff7474}
    .impact-critical{color:#ff4c4c}
    .impact-critical:before{animation:pulse 1.6s infinite}
    .event-list{display:grid;gap:9px}
    .event-card{padding:15px;display:grid;grid-template-columns:65px minmax(0,1fr) auto;gap:13px;align-items:center}
    .event-time{font-size:11px;color:var(--muted);font-weight:700}
    .event-card-title{font-size:12px;font-weight:750;margin-bottom:3px}
    .event-card-meta{font-size:10px;color:var(--subtle)}
    .event-card-right{display:flex;align-items:center;gap:10px}
    .event-count{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
    .filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0}
    .filter-row .input{max-width:240px}
    .filter-row .select{width:auto;min-width:122px}
    .filter-tabs{display:flex;gap:5px;overflow:auto;scrollbar-width:none}
    .filter-tabs button{padding:7px 10px;white-space:nowrap;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:10px}
    .filter-tabs button.active{color:var(--bright);background:rgba(0,217,165,.08);border-color:rgba(0,217,165,.22)}
    .date-separator{display:flex;align-items:center;gap:11px;color:var(--subtle);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:19px 0 9px}
    .date-separator:after{content:"";height:1px;flex:1;background:var(--border)}
    .news-detail-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.75fr);gap:14px}
    .detail-main{padding:23px}
    .detail-title{font-size:27px;letter-spacing:-.05em;line-height:1.16;margin:15px 0 8px}
    .detail-subtitle{font-size:11px;color:var(--muted)}
    .detail-countdown{font-size:25px;font-weight:750;letter-spacing:.04em;margin:20px 0}
    .detail-section{border-top:1px solid var(--border);padding-top:19px;margin-top:20px}
    .detail-section h3{font-size:12px;margin:0 0 11px}
    .detail-section p{font-size:11px;color:var(--muted);line-height:1.8;margin:0}
    .affected-list{display:flex;flex-wrap:wrap;gap:7px}
    .affected-list .pill{font-size:9px}
    .probability-detail{padding:21px}
    .probability-circle{width:150px;height:150px;border-radius:50%;margin:22px auto 15px;display:grid;place-items:center;position:relative;background:conic-gradient(var(--bright) 0 var(--bullish),#ef4444 var(--bullish) 100%)}
    .probability-circle:before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
    .probability-center{position:relative;text-align:center}
    .probability-center strong{display:block;font-size:29px;letter-spacing:-.06em}
    .probability-center span{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .market-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:17px 0}
    .market-tabs{display:flex;gap:5px;flex-wrap:wrap}
    .market-tabs button{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 10px;font-size:10px;cursor:pointer}
    .market-tabs button.active{color:var(--bright);border-color:rgba(0,217,165,.22);background:rgba(0,217,165,.07)}
    .market-page-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .market-page-card{padding:18px}
    .market-page-card .market-price{font-size:24px;margin-top:20px}
    .market-card-chart{height:45px;margin:7px 0}
    .detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}

    /* Profile, settings, support, admin */
    .profile-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
    .profile-card{padding:22px}
    .profile-hero{text-align:center;padding:15px 0 20px;border-bottom:1px solid var(--border)}
    .avatar-large{width:66px;height:66px;border-radius:20px;margin:0 auto 12px;font-size:20px}
    .profile-hero h2{font-size:17px;margin:0 0 3px}
    .profile-hero p{font-size:10px;color:var(--muted);margin:0}
    .profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
    .profile-stat{padding:11px;border:1px solid var(--border);border-radius:10px}
    .profile-stat span{font-size:9px;color:var(--subtle);display:block}
    .profile-stat strong{font-size:12px;display:block;margin-top:4px}
    .profile-info{padding:19px}
    .info-row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--border);font-size:11px}
    .info-row:last-child{border-bottom:0}
    .info-row span{color:var(--muted)}
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .settings-card{padding:20px}
    .settings-card h3{font-size:13px;margin:0 0 4px}
    .settings-card>p{font-size:10px;color:var(--muted);margin:0 0 14px}
    .setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--border)}
    .setting-row:first-of-type{border-top:0}
    .setting-copy strong{font-size:11px;display:block}
    .setting-copy span{font-size:9px;color:var(--subtle)}
    .switch{appearance:none;width:35px;height:20px;border-radius:99px;background:#343a3a;position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
    .switch:before{content:"";position:absolute;width:14px;height:14px;border-radius:50%;left:3px;top:3px;background:#aaa;transition:.2s}
    .switch:checked{background:rgba(38,166,154,.8)}
    .switch:checked:before{left:18px;background:#fff}
    .support-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .ticket-card{padding:21px}
    .support-faq{display:grid;gap:8px}
    .support-faq .faq-item{background:var(--card)}
    .admin-kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:13px}
    .admin-chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
    .admin-chart-card{padding:18px;min-width:0}
    .admin-chart{width:100%;height:210px;margin-top:13px}
    .admin-subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
    .admin-subnav .btn{min-height:34px;padding:0 11px;font-size:10px}
    .table-actions{display:flex;gap:5px}
    .table-actions .btn-icon{width:29px;height:29px}
    .admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
    .admin-toolbar h2{font-size:14px;margin:0}
    .unauthorized{max-width:530px;margin:80px auto;text-align:center;padding:30px}
    .unauthorized .empty-icon{color:var(--negative)}
    .legal-copy{max-width:800px}
    .legal-copy h2{font-size:21px;margin-top:28px}
    .legal-copy p,.legal-copy li{font-size:13px;color:var(--muted);line-height:1.85}

    /* Authentication */
    .auth-screen{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--bg)}
    .auth-aside{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:35px 46px;background:radial-gradient(ellipse at 64% 38%,rgba(0,217,165,.12),transparent 42%),linear-gradient(145deg,#0b1110,#060707)}
    .auth-aside:after{content:"";position:absolute;inset:0;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(black,transparent)}
    .auth-aside>*{position:relative;z-index:1}
    .auth-aside-copy{max-width:460px;margin:auto 0}
    .auth-aside-copy h2{font-size:clamp(34px,4.5vw,54px);letter-spacing:-.06em;line-height:1.05;margin:17px 0}
    .auth-aside-copy p{font-size:13px;color:var(--muted);line-height:1.75}
    .auth-aside-foot{font-size:10px;color:var(--subtle)}
    .auth-form-side{display:grid;place-items:center;padding:35px 24px}
    .auth-box{width:min(390px,100%)}
    .auth-box-head{margin-bottom:25px}
    .auth-box-head h1{font-size:28px;letter-spacing:-.05em;margin:0 0 7px}
    .auth-box-head p{font-size:11px;color:var(--muted);margin:0}
    .auth-demo-box{padding:12px;border:1px solid rgba(0,217,165,.16);border-radius:10px;background:rgba(0,217,165,.04);font-size:10px;color:var(--muted);margin:15px 0}
    .auth-demo-box strong{color:var(--bright)}
    .auth-submit{width:100%;margin-top:5px}
    .auth-bottom{margin-top:18px;text-align:center;font-size:11px;color:var(--muted)}
    .text-button{border:0;background:none;color:var(--bright);font-size:inherit;font-weight:700;cursor:pointer;padding:0}
    .auth-back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;margin-bottom:23px;cursor:pointer}
    .password-meter{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:6px 0 2px}
    .password-meter div{height:100%;width:0;background:var(--negative);transition:width .2s,background .2s}
    .auth-mobile-brand{display:none}

    /* Modal, search and toast */
    .modal-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px;animation:fadeUp .15s ease}
    .modal{width:min(520px,100%);max-height:min(88vh,850px);overflow:auto;background:#111414;border:1px solid var(--border-strong);border-radius:17px;box-shadow:0 30px 100px rgba(0,0,0,.7);animation:pop .2s ease}
    .modal.wide{width:min(740px,100%)}

  function setSession(user){
    db.session={id:user.id,name:user.name,email:user.email,role:user.role,plan:user.plan,status:user.status||"Active"};
    const idx=db.users.findIndex(u=>u.id===user.id);

    safeSave();
  }
  function signIn(email,password){
    const normalized=email.trim().toLowerCase();
    if(normalized==="demo@detwal.in"&&password==="demo123"){
      let user=db.users.find(u=>u.email.toLowerCase()==="daksh@detwal.in");
      if(!user){user={id:"u-daksh",name:"Daksh",email:"daksh@detwal.in",role:"user",plan:"PRO",status:"Active",joinedAt:new Date().toISOString().slice(0,10),lastActive:"Today",avatar:"D"};db.users.push(user)}
      setSession(user);return true;
    }
    if(normalized==="admin@detwal.in"&&password==="admin123"){
      const user=db.users.find(u=>u.email.toLowerCase()==="admin@detwal.in")||{id:"u-admin",name:"Admin",email:"admin@detwal.in",role:"admin",plan:"ADMIN",status:"Active",joinedAt:"2025-02-03",lastActive:"Today",avatar:"A"};
      if(!db.users.some(u=>u.id===user.id))db.users.push(user);
      setSession(user);return true;
    }
    const user=db.users.find(u=>u.email.toLowerCase()===normalized);
    if(user&&db.credentials[normalized]===password&&user.status!=="Suspended"){setSession(user);return true}
    return false;
  }

  function routeFromHash(){
    const raw=decodeURIComponent(location.hash.replace(/^#/,"")||"home");
    const parts=raw.split("/");
    const route=parts[0];
    if(route==="news"&&parts[1])return {view:"detail",id:parts[1]};
    const map={"home":"home","features":"home","dashboard":"dashboard","news":"news","markets":"markets","pricing":"pricing","profile":"profile","settings":"settings","support":"support","login":"login","signup":"signup","forgot":"forgot","admin":"admin","privacy":"privacy","terms":"terms","disclaimer":"disclaimer","404":"notfound"};
    if(route==="admin"){
      const sub=parts[1];
      const adminMap={users:"admin-users",news:"admin-news",subscriptions:"admin-subscriptions",payments:"admin-payments",coupons:"admin-coupons",activity:"admin-activity",settings:"admin-settings"};
      return {view:sub?adminMap[sub]||"notfound":"admin"};
    }
    return {view:map[route]||"notfound"};
  }
  const routeHash=(view,params={})=>{
    if(view==="detail")return "#news/"+encodeURIComponent(params.id||state.detailId||"nfp");
    const map={"admin-users":"admin/users","admin-news":"admin/news","admin-subscriptions":"admin/subscriptions","admin-payments":"admin/payments","admin-coupons":"admin/coupons","admin-activity":"admin/activity","admin-settings":"admin/settings"};
    return "#"+(map[view]||view);
  };
  function navigate(view,params={},replace=false){
    if(["dashboard","profile","settings"].includes(view)&&!currentUser()){
      state.returnView=view;view="login";params={};

    state.view=view;
    state.detailId=params.id||null;
    state.notificationsOpen=false;state.mobileMenu=false;state.sidebarMobileOpen=false;state.modal=null;
    const hash=routeHash(view,params);
    if(replace)history.replaceState({view,params},"",hash);else history.pushState({view,params},"",hash);
    render();
    if(view==="home"&&params.anchor)setTimeout(()=>scrollToAnchor(params.anchor),40);
    else window.scrollTo({top:0,behavior:"smooth"});
  }

  function revealObserver(){
    const els=$$(".reveal");
    if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("is-visible"));return}
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("is-visible");observer.unobserve(entry.target)}});
    },{threshold:.08});
    els.forEach(e=>observer.observe(e));
  }

  function renderNewsList(){
    const f=state.newsFilters;
    const all=db.news.slice().sort((a,b)=>a.timestamp-b.timestamp);
    const filtered=all.filter(e=>{
      const search=(f.search||"").toLowerCase();
      const matchSearch=!search||`${e.title} ${e.country} ${e.currency} ${e.affectedMarkets.join(" ")}`.toLowerCase().includes(search);
      const matchImpact=f.impact==="All"||e.impact===f.impact.toLowerCase();
      const matchCurrency=f.currency==="All"||e.currency===f.currency;
      let matchDate=true;
      const d=new Date(e.timestamp),now=new Date();
      if(f.date==="Today")matchDate=d.toDateString()===now.toDateString();
      if(f.date==="Tomorrow"){const tomorrow=new Date(now);tomorrow.setDate(now.getDate()+1);matchDate=d.toDateString()===tomorrow.toDateString()}
      if(f.date==="This Week"){const end=new Date(now);end.setDate(now.getDate()+7);matchDate=d>=new Date(now.getFullYear(),now.getMonth(),now.getDate())&&d<=end}
      return matchSearch&&matchImpact&&matchCurrency&&matchDate;
    });
    const groups=new Map();
    filtered.forEach(e=>{const key=fmtDate(e.timestamp,{weekday:"long",month:"long",day:"numeric"});if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e)});
    return `<main class="page-enter"><div class="page-heading"><div><span class="eyebrow">Economic calendar</span><h1>News intelligence</h1><p>Follow upcoming events and review simulated event context.</p></div><div class="heading-actions"><span class="badge badge-demo">DEMO CALENDAR</span><button class="btn btn-secondary btn-sm" data-action="refresh-news">${ic("refresh",14)} Refresh demo data</button></div></div>

  function openModal(type,data={}){
    state.modal={type,...data};render();
    setTimeout(()=>{const first=$(".modal input:not([type=hidden]), .modal select, .modal textarea");if(first&&type!=="confirm")first.focus({preventScroll:true});},40);
  }
  function closeModal(){state.modal=null;render()}
  function couponCheck(code,amount){
    const normalized=String(code||"").trim().toUpperCase();
    if(!normalized)return {ok:false,message:"Enter a coupon code."};
    const coupon=db.coupons.find(c=>c.code.toUpperCase()===normalized&&c.status==="Active");
    if(!coupon)return {ok:false,message:"That coupon code is not valid."};
    if(coupon.expiry&&new Date(coupon.expiry+"T23:59:59")<new Date())return {ok:false,message:"This coupon has expired."};
    const discount=Math.min(Number(coupon.discount)||0,90);
    return {ok:true,code:normalized,discount,amountOff:amount*discount/100,message:`${discount}% discount applied.`};
  }
  function basePrice(plan,billing){
    const p=PRICING[plan]||PRICING.pro;
    const monthly=billing==="yearly"?p.yearlyMonthly:p.monthly;
    return billing==="yearly"?monthly*12:monthly;
  }

  function seriesFor(timeframe="1D",base=3850){
    const count=timeframe==="1H"?34:timeframe==="4H"?40:timeframe==="1W"?52:48;
    const amp=timeframe==="1H"?1.2:timeframe==="4H"?2.2:timeframe==="1W"?4.6:3.1;
    return Array.from({length:count},(_,i)=>{
      const trend=i/(count-1)*amp*1.9;
      const wave=Math.sin(i*.57)*amp*.56+Math.sin(i*.19+1)*amp*.47+Math.cos(i*.96)*amp*.18;
      return base+trend+wave-amp*.75;
    });
  }
  function drawCanvas(canvas){
    const rect=canvas.getBoundingClientRect();
    if(!rect.width||!rect.height)return;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.floor(rect.width*dpr);canvas.height=Math.floor(rect.height*dpr);
    const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);
    const w=rect.width,h=rect.height,type=canvas.dataset.chart;
    ctx.clearRect(0,0,w,h);
    if(type==="spark"){
      const m=marketFor(canvas.dataset.market)||marketData[0],values=m.history;
      const min=Math.min(...values),max=Math.max(...values),pad=4;
      ctx.beginPath();
      values.forEach((v,i)=>{const x=pad+i/(values.length-1)*(w-pad*2),y=h-pad-(v-min)/(max-min||1)*(h-pad*2);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
      ctx.strokeStyle=m.changePercent>=0?"#26a69a":"#ef4444";ctx.lineWidth=1.7;ctx.stroke();return;
    }
    if(type==="bar"){
      const values=[18,25,22,34,40,38,47,55,53,67,72,81],labels=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const max=90,pad={l:8,r:8,t:10,b:24},plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;
      ctx.strokeStyle="rgba(255,255,255,.07)";ctx.lineWidth=1;
      for(let i=0;i<4;i++){let y=pad.t+i*plotH/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke()}
      const bw=plotW/values.length*.52;
      values.forEach((v,i)=>{const x=pad.l+i*plotW/values.length+(plotW/values.length-bw)/2,y=pad.t+plotH-v/max*plotH;ctx.fillStyle=i>8?"rgba(0,217,165,.8)":"rgba(38,166,154,.55)";ctx.beginPath();ctx.roundRect(x,y,bw,pad.t+plotH-y,4);ctx.fill();ctx.fillStyle="#737e80";ctx.font="9px Inter,system-ui";ctx.textAlign="center";ctx.fillText(labels[i],x+bw/2,h-6)});
      return;
    }
    if(type==="donut"){
      const values=[38,28,22,12],colors=["#26a69a","#3b82f6","#f59e0b","#6b7280"],cx=w*.42,cy=h*.52,r=Math.min(73,h*.34),inner=r*.66;
      let start=-Math.PI/2;
      values.forEach((v,i)=>{const end=start+v/100*Math.PI*2;ctx.beginPath();ctx.arc(cx,cy,r,start,end);ctx.arc(cx,cy,inner,end,start,true);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();start=end});
      ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="700 17px Inter,system-ui";ctx.fillText("100%",cx,cy+4);
      const legend=["PRO","PREMIUM","FREE","OTHER"];ctx.textAlign="left";ctx.font="10px Inter,system-ui";
      legend.forEach((l,i)=>{const y=cy-27+i*19;ctx.fillStyle=colors[i];ctx.fillRect(w*.68,y-7,7,7);ctx.fillStyle="#a1a1aa";ctx.fillText(l,w*.68+13,y)});
      return;
    }
    const tf=canvas.dataset.tf||"1D",values=seriesFor(tf,3850.2);
    const pad={l:4,r:4,t:11,b:8},plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;
    const min=Math.min(...values)-.8,max=Math.max(...values)+.8;
    ctx.strokeStyle="rgba(255,255,255,.075)";ctx.lineWidth=1;
    for(let i=0;i<4;i++){const y=pad.t+i*plotH/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke()}
    const points=values.map((v,i)=>({x:pad.l+i/(values.length-1)*plotW,y:pad.t+(max-v)/(max-min)*plotH}));
    const gradient=ctx.createLinearGradient(0,pad.t,0,h);
    gradient.addColorStop(0,"rgba(38,166,154,.28)");gradient.addColorStop(1,"rgba(38,166,154,0)");
    ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineTo(points[points.length-1].x,h);ctx.lineTo(points[0].x,h);ctx.closePath();ctx.fillStyle=gradient;ctx.fill();
    ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle="#26a69a";ctx.lineWidth=2;ctx.lineJoin="round";ctx.stroke();
    const last=points[points.length-1];ctx.beginPath();ctx.arc(last.x,last.y,3.5,0,Math.PI*2);ctx.fillStyle="#00d9a5";ctx.fill();ctx.beginPath();ctx.arc(last.x,last.y,7,0,Math.PI*2);ctx.strokeStyle="rgba(0,217,165,.24)";ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle="#758082";ctx.font="9px Inter,system-ui";ctx.textAlign="right";ctx.fillText("$"+max.toFixed(0),w-2,pad.t+4);ctx.fillText("$"+min.toFixed(0),w-2,h-4);
  }

      if(state.sidebarMobileOpen){state.sidebarMobileOpen=false;render();return}

      if(event.key==="ArrowDown"){event.preventDefault();state.searchActive=Math.min(results.length-1,state.searchActive+1);renderSearchResultsOnly()}
      if(event.key==="ArrowUp"){event.preventDefault();state.searchActive=Math.max(0,state.searchActive-1);renderSearchResultsOnly()}

        const r=results[state.searchActive];state.modal=null;

    const el=event.target;
    if(el.dataset.filter){
      state.newsFilters[el.dataset.filter]=el.value;render();return;
    }
    if(el.dataset.setting){
      const key=el.dataset.setting;
      db.settings[key]=el.type==="checkbox"?el.checked:el.value;
      safeSave();render();showToast("Settings saved locally.","success");return;
    }
    if(el.dataset.adminSetting){
      if(!isAdmin()){showToast("Unauthorized.","error");return}
      db.adminSettings[el.dataset.adminSetting]=el.checked;safeSave();showToast("Admin setting updated.","success");return;
    }
  });
  function rerenderKeepingFocus(el){
    const id=el.id||el.dataset.preserve,selection=typeof el.selectionStart==="number"?el.selectionStart:null;
    render();
    const next=id?$("#"+CSS.escape(id)):null;
    if(next){next.focus();if(selection!==null&&next.setSelectionRange)next.setSelectionRange(selection,selection)}
  }
  function renderSearchResultsOnly(){
    const container=$("#search-results");if(!container)return;
    const results=searchResults(state.searchQuery);
    container.innerHTML=results.length?results.map((r,i)=>`<button class="search-result ${i===state.searchActive?"active":""}" data-action="search-result" data-kind="${r.kind}" data-id="${esc(r.id||"")}" data-view="${esc(r.view||"")}"><span class="search-result-icon">${ic(r.icon,15)}</span><span class="search-result-copy"><strong>${esc(r.title)}</strong><span>${esc(r.subtitle)}</span></span>${ic("arrow",13)}</button>`).join(""):`<div class="empty-state" style="padding:25px 10px"><h3>No results found</h3><p>Try a market symbol, event name or page.</p></div>`;
  }

  document.addEventListener("submit",async event=>{
    const form=event.target.closest("form[data-form]");if(!form)return;
    event.preventDefault();
    const type=form.dataset.form,data=Object.fromEntries(new FormData(form).entries());
    if(type==="login"){
      const ok=signIn(data.email||"",data.password||"");
      if(!ok){showAuthError("Email or password doesn't match the demo accounts.");return}
      addActivity("Signed in");navigate(isAdmin()?"admin":"dashboard");showToast("Signed in to the DETWAL demo.","success");
    }else if(type==="signup"){
      if(!db.adminSettings.registration){showToast("Demo registration is currently disabled.","error");return}
      if(data.password!==data.confirm){showAuthError("Passwords do not match.");return}
      if(String(data.password||"").length<6){showAuthError("Password must be at least 6 characters.");return}
      const email=String(data.email||"").trim().toLowerCase();
      if(db.users.some(u=>u.email.toLowerCase()===email)){showAuthError("An account with this email already exists.");return}
      const user={id:uid("u"),name:String(data.name||"New User").trim(),email,role:"user",plan:"FREE",status:"Active",joinedAt:new Date().toISOString().slice(0,10),lastActive:"Today",avatar:initials(data.name)};
      db.users.push(user);db.credentials[email]=data.password;
      db.subscriptions.push({id:uid("sub"),userId:user.id,plan:"FREE",status:"Active",startDate:user.joinedAt,endDate:"—",amount:0,paymentStatus:"N/A"});
      setSession(user);safeSave();addActivity("Created demo account");navigate("dashboard");showToast("Account created. Welcome to DETWAL.","success");
    }else if(type==="forgot"){
      showToast(`If ${data.email} is registered, demo reset instructions are ready. No email was sent.`,"info");
      openModal("confirm",{title:"Demo reset request",message:`A simulated reset request was recorded for ${data.email}. This offline demo does not send email.`,confirmLabel:"Got it",confirmAction:"close"});
    }else if(type==="checkout"){
      const modal=state.modal;if(!modal||modal.type!=="checkout")return;
      const plan=modal.plan,billing=modal.billing,base=basePrice(plan,billing),code=String(data.coupon||modal.coupon||"").trim().toUpperCase();
      const coupon=code?couponCheck(code,base):null;
      if(code&&(!coupon||!coupon.ok)){state.modal={...modal,coupon:code,couponMessage:coupon?.message||"Invalid coupon.",couponValid:false};render();showToast("Please check your coupon code.","error");return}
      const total=Math.max(0,base-(coupon?.amountOff||0));
      const result=await payments.createCheckout({plan,billing,total,email:data.email,method:data.method});
      const verified=await payments.verifyPayment(result);
      if(!verified){showToast("Demo payment could not be verified.","error");return}
      let user=currentUser();
      if(user){
        user.plan=plan.toUpperCase();
        const existing=db.subscriptions.find(s=>s.userId===user.id);
        const start=new Date().toISOString().slice(0,10),end=new Date(Date.now()+365*86400000).toISOString().slice(0,10);
        if(existing)Object.assign(existing,{plan:user.plan,status:"Active",startDate:start,endDate:end,amount:total,paymentStatus:"Demo paid"});
        else db.subscriptions.push({id:uid("sub"),userId:user.id,plan:user.plan,status:"Active",startDate:start,endDate:end,amount:total,paymentStatus:"Demo paid"});
        const userRec=db.users.find(u=>u.id===user.id);if(userRec)userRec.plan=user.plan;
        if(db.session)db.session.plan=user.plan;
      }else{
        db.subscriptions.push({id:uid("sub"),userId:"guest-"+uid(""),plan:plan.toUpperCase(),status:"Demo checkout",startDate:new Date().toISOString().slice(0,10),endDate:"—",amount:total,paymentStatus:"Demo paid"});
      }
      db.payments.unshift({id:result.id,user:data.name||user?.name||data.email,plan:plan.toUpperCase(),amount:total,status:"Demo paid",date:new Date().toISOString().slice(0,10)});
      db.notifications.unshift({id:uid("notif"),text:"Your demo subscription is active.",time:"Just now",read:false});
      safeSave();addActivity("Demo checkout completed");state.modal={type:"payment-success",plan:plan.toUpperCase()};render();
    }else if(type==="profile"){
      const user=currentUser();if(!user)return;
      const email=String(data.email||"").trim().toLowerCase();
      if(db.users.some(u=>u.email.toLowerCase()===email&&u.id!==user.id)){showToast("That email is already in use.","error");return}
      const record=db.users.find(u=>u.id===user.id);if(record){record.name=String(data.name).trim();record.email=email;record.avatar=initials(record.name)}
      if(db.session){db.session.name=record.name;db.session.email=record.email}
      safeSave();state.modal=null;render();addActivity("Profile updated");showToast("Profile updated.","success");
    }else if(type==="password"){
      if(data.password!==data.confirm){showToast("New passwords do not match.","error");return}
      if(String(data.password).length<6){showToast("Use at least 6 characters.","error");return}
      const user=currentUser();if(user&&!["demo@detwal.in","admin@detwal.in"].includes(user.email)){
        db.credentials[user.email.toLowerCase()]=data.password;
      }
      state.modal=null;safeSave();render();showToast("Demo password updated.","success");
    }else if(type==="ticket"){
      const ticket={id:uid("ticket"),...data,status:"Open",createdAt:new Date().toISOString()};
      await api.createTicket(ticket);db.notifications.unshift({id:uid("notif"),text:"Your demo support ticket was submitted.",time:"Just now",read:false});
      addActivity("Support ticket submitted");render();showToast("Ticket submitted. It is saved locally in this demo.","success");form.reset();
    }else if(type==="news"){
      const id=data.id||uid("news");
      const timestamp=Date.parse(data.timestamp);
      const bullish=Math.min(100,Math.max(0,Number(data.bullish)||0));
      const bearish=Math.min(100,Math.max(0,Number(data.bearish)||0));
      const neutral=Math.min(100,Math.max(0,Number(data.neutral)||0));
      const eventObj={id,title:String(data.title).trim(),country:String(data.country||"United States").trim(),currency:String(data.currency||"USD").trim().toUpperCase(),impact:data.impact,timestamp:Number.isFinite(timestamp)?timestamp:Date.now()+86400000,previous:data.previous||"—",forecast:data.forecast||"—",actual:data.actual||"—",status:timestamp>Date.now()?"upcoming":"released",affectedMarkets:String(data.markets||"").split(",").map(x=>x.trim()).filter(Boolean),bullishProbability:bullish,bearishProbability:bearish,neutralProbability:neutral,description:data.description||"Demo event created in DETWAL admin.",historicalContext:"Historical observations are simulated demo context and are not a prediction."};
      const index=db.news.findIndex(e=>e.id===id);if(index>=0)db.news[index]=eventObj;else db.news.push(eventObj);
      safeSave();addActivity(index>=0?"Updated news event":"Created news event");state.modal=null;render();showToast(index>=0?"Event updated.":"Event created.","success");
    }else if(type==="coupon"){
      const id=data.id||uid("coupon"),code=String(data.code||"").trim().toUpperCase();
      const duplicate=db.coupons.some(c=>c.code.toUpperCase()===code&&c.id!==id);
      if(duplicate){showToast("A coupon with that code already exists.","error");return}
      const item={id,code,discount:Math.min(90,Math.max(1,Number(data.discount)||1)),type:"percent",expiry:data.expiry,limit:Math.max(1,Number(data.limit)||1),status:data.status};
      const i=db.coupons.findIndex(c=>c.id===id);if(i>=0)db.coupons[i]=item;else db.coupons.push(item);
      safeSave();state.modal=null;render();showToast(i>=0?"Coupon updated.":"Coupon created.","success");
    }else if(type==="user"){
      const id=data.id||uid("u"),email=String(data.email||"").trim().toLowerCase();
      if(db.users.some(u=>u.email.toLowerCase()===email&&u.id!==id)){showToast("A user with that email already exists.","error");return}
      const existing=db.users.find(u=>u.id===id);
      const user={...(existing||{}),id,name:String(data.name).trim(),email,plan:data.plan,role:data.role,status:existing?.status||"Active",joinedAt:existing?.joinedAt||new Date().toISOString().slice(0,10),lastActive:existing?.lastActive||"Never",avatar:initials(data.name)};
      const idx=db.users.findIndex(u=>u.id===id);if(idx>=0)db.users[idx]=user;else db.users.push(user);
      safeSave();state.modal=null;render();showToast(idx>=0?"User updated.":"User created.","success");
    }
  });

  /* =========================================================
     INITIALIZATION / LIFECYCLE
     ========================================================= */
  window.addEventListener("popstate",()=>{
    const route=routeFromHash();state.view=route.view;state.detailId=route.id||null;state.modal=null;
    if(["dashboard","profile","settings"].includes(state.view)&&!currentUser())state.view="login";
    render();
  });
  window.addEventListener("resize",()=>drawAllCharts());
  window.setInterval(()=>{
    updateCountdowns();
    if(Date.now()%5000<1000){
      livePrice+=((Math.random()-.48)*.22);
      $$("[data-live-price]").forEach(el=>{el.textContent="$"+livePrice.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})});
    }
  },1000);
  initializeRoute();
  render();
  </script>
</body>
</html>
